<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f8f5">
  <meta name="description" content="Manage your StayNest properties, guest stays, messages and earnings in Host Studio.">
  <title>Host Studio | StayNest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="host-dashboard.css">
</head>
<body>
  <main class="host-dashboard" id="hostDashboard">
    <button class="sidebar-scrim" id="sidebarScrim" aria-label="Close navigation" type="button"></button>
    <aside class="dashboard-sidebar" id="dashboardSidebar">
      <a class="dashboard-brand" href="home.html" aria-label="StayNest home"><span class="dashboard-brand-mark">S</span><span>StayNest<small>HOST STUDIO</small></span></a>
      <div class="host-profile"><div class="host-profile-avatar">AO</div><div class="profile-copy"><strong>Amaka Okafor</strong><small>Host account</small></div><button class="profile-menu" data-tab="Settings" aria-label="Open profile settings" type="button">•••</button></div>
      <p class="nav-caption">YOUR WORKSPACE</p>
      <nav class="dashboard-nav" aria-label="Host dashboard sections">
        <button class="active" data-tab="Overview" type="button"><span class="nav-icon">⌂</span><span>Overview</span></button>
        <button data-tab="My Properties" type="button"><span class="nav-icon">▦</span><span>My Properties</span></button>
        <button data-tab="Bookings" type="button"><span class="nav-icon">▤</span><span>Bookings</span><i class="nav-badge" id="bookingBadge">2</i></button>
        <button data-tab="Calendar" type="button"><span class="nav-icon">▦</span><span>Calendar</span></button>
        <button data-tab="Messages" type="button"><span class="nav-icon">◌</span><span>Messages</span><i class="nav-badge">3</i></button>
        <button data-tab="Earnings" type="button"><span class="nav-icon">₦</span><span>Earnings</span></button>
        <button data-tab="Reviews" type="button"><span class="nav-icon">★</span><span>Reviews</span></button>
        <button data-tab="Settings" type="button"><span class="nav-icon">⚙</span><span>Settings</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="support-card"><span class="support-sparkle">✦</span><strong>Here when you need us</strong><p>Questions about a stay? Our host team can help.</p><button data-tab="Help & Support" type="button">Visit Help &amp; Support <span>↗</span></button></div>
        <a href="home.html" class="sidebar-link">← Back to StayNest</a>
        <button id="logoutButton" class="logout-button" type="button"><span>↪</span> Log out</button>
      </div>
    </aside>

    <section class="dashboard-shell">
      <header class="dashboard-header">
        <button class="dashboard-menu" id="menuButton" type="button" aria-label="Open navigation" aria-expanded="false">☰</button>
        <div class="header-title"><p id="headerDate">YOUR HOST SPACE</p><h1 id="pageTitle">Overview</h1></div>
        <div class="header-actions">
          <label class="global-search"><span aria-hidden="true">⌕</span><input id="globalSearch" type="search" placeholder="Search stays, guests..." aria-label="Search dashboard"><kbd>⌘ K</kbd></label>
          <span class="workspace-status"><i></i> HOST WORKSPACE</span>
          <div class="header-menu-wrap"><button class="header-icon-button" id="notificationButton" type="button" aria-label="Notifications" aria-expanded="false">♧<i></i></button><section class="header-popover notification-popover" id="notificationPopover" hidden></section></div>
          <button class="header-icon-button help-button" data-tab="Help & Support" type="button" aria-label="Help and support">?</button>
          <div class="header-menu-wrap"><button class="profile-trigger" id="profileButton" type="button" aria-expanded="false"><span class="header-avatar">AO</span><span class="profile-trigger-copy"><strong>Amaka Okafor</strong><small>Host</small></span><span class="chevron">⌄</span></button><section class="header-popover profile-popover" id="profilePopover" hidden><strong>Amaka Okafor</strong><small>amaka.okafor@example.com</small><button data-action="view-profile" type="button">View profile</button><button data-tab="Settings" type="button">Account settings</button><button data-tab="Help & Support" type="button">Help &amp; support</button><button data-action="logout" type="button" class="popover-logout">Log out</button></section></div>
        </div>
      </header>
      <nav class="mobile-workspace-nav" id="mobileWorkspaceNav" aria-label="Quick workspace navigation"></nav>
      <div class="dashboard-content" id="dashboardContent" aria-live="polite"></div>
    </section>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <dialog class="app-modal" id="appModal" aria-labelledby="modalTitle"><div class="modal-card"><button class="modal-close" data-action="close-modal" type="button" aria-label="Close dialog">×</button><div id="modalContent"></div></div></dialog>
  </main>
  <script src="host-dashboard.js" defer></script>
</body>
</html>
