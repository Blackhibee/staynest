<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StayNest | Log in</title>
    <meta
      name="description"
      content="Log in to your StayNest account"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <aside class="brand-panel" aria-label="Branding and highlights">
        <div class="brand-content">
          <div class="brand-logo-wrap">
            <img src="assets/logo.svg" alt="StayNest house logo" class="brand-logo" />
          </div>

          <div class="brand-meta">
            <h1>StayNest</h1>
            <p>Find a place that feels like home.</p>
          </div>
        </div>
      </aside>

      <main class="login-card" aria-label="Login form">
        <div class="login-header">
          <p class="eyebrow">Welcome back</p>
          <h2>Sign in to your account</h2>
        </div>

        <form id="loginForm" novalidate>
          <div class="field-group">
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="name@company.com"
              autocomplete="email"
              aria-invalid="false"
            />
            <small class="error-message" data-error-for="email"></small>
          </div>

          <div class="field-group">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input
                id="password"
                name="password"
                type="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                aria-invalid="false"
              />
              <button
                type="button"
                class="toggle-password"
                aria-label="Show password"
                aria-pressed="false"
              >
                Show
              </button>
            </div>
            <small class="error-message" data-error-for="password"></small>
          </div>

          <div class="form-row">
            <label class="checkbox-row" for="rememberMe">
              <input id="rememberMe" type="checkbox" />
              <span>Remember me</span>
            </label>
            <a href="#" class="link-button">Forgot password?</a>
          </div>

          <button id="loginButton" class="login-button" type="submit">
            <span class="button-text">Login</span>
            <span class="spinner" aria-hidden="true"></span>
          </button>

          <div class="divider" aria-label="Or continue with">
            <span>or continue with</span>
          </div>

          <button type="button" class="google-button" id="googleButton" aria-label="Continue with Google">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                fill="#4285F4"
                d="M21.6 12.23c0-.7-.06-1.38-.18-2.03H12v3.85h5.39a4.63 4.63 0 0 1-2 3.04v2.52h3.24c1.89-1.74 2.97-4.31 2.97-7.38Z"
              />
              <path
                fill="#34A853"
                d="M12 22c2.7 0 4.97-.9 6.63-2.43l-3.24-2.52c-.9.6-2.06.96-3.39.96-2.61 0-4.82-1.76-5.61-4.12H.88v2.65A10 10 0 0 0 12 22Z"
              />
              <path
                fill="#FBBC05"
                d="M6.39 19.87A6.05 6.05 0 0 1 6 16.7V14.1H2.78A9.96 9.96 0 0 0 2 12c0-1.62.39-3.17 1.08-4.52L6.39 10.1a6.04 6.04 0 0 1-.01 9.77Z"
              />
              <path
                fill="#EA4335"
                d="M12 3.98c1.47 0 2.79.5 3.83 1.49l2.86-2.86A9.99 9.99 0 0 0 2.56 7.48L6.4 9.86A6.02 6.02 0 0 1 12 3.98Z"
              />
            </svg>
            <span>Google login later</span>
          </button>

          <button type="button" class="google-button apple-button" id="appleButton" aria-label="Continue with Apple">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M17.05 12.54c-.02-2.17 1.77-3.22 1.85-3.27a3.98 3.98 0 0 0-3.13-1.69c-1.32-.14-2.59.79-3.26.79-.68 0-1.72-.77-2.83-.75a4.17 4.17 0 0 0-3.51 2.14c-1.52 2.64-.39 6.53 1.07 8.66.73 1.04 1.57 2.2 2.69 2.16 1.08-.04 1.49-.69 2.8-.69 1.31 0 1.68.69 2.82.67 1.17-.02 1.9-1.06 2.61-2.11a8.68 8.68 0 0 0 1.2-2.45 3.8 3.8 0 0 1-2.31-3.46Zm-2.14-6.35a3.83 3.83 0 0 0 .88-2.75 3.9 3.9 0 0 0-2.53 1.31 3.66 3.66 0 0 0-.91 2.65 3.23 3.23 0 0 0 2.56-1.21Z" />
            </svg>
            <span>Continue with Apple</span>
          </button>

          <p class="signup-copy">
            Don’t have an account?
            <a href="signup.html" class="link-button">Sign up</a>
          </p>
        </form>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
